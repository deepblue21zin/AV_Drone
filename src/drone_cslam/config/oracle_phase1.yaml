vehicles:
  - name: drone1
    spawn: [3.0, -7.5, 0.0]
  - name: drone2
    spawn: [3.0, 7.5, 0.0]

topics:
  scan_suffix: scan
  odom_suffix: odom
  ground_truth_suffix: ground_truth/odom
  tf: /tf
  tf_static: /tf_static

sampling:
  keyframe_translation_m: 2.0
  keyframe_yaw_deg: 5.0
  interpolation_max_gap_sec: 0.25
  map_scan_stride: 2
  map_beam_stride: 3

pose_graph:
  intra_translation_sigma_m: 0.15
  intra_yaw_sigma_deg: 2.0
  prior_translation_sigma_m: 0.02
  prior_yaw_sigma_deg: 0.2
  oracle_translation_sigma_m: 0.05
  oracle_yaw_sigma_deg: 0.5
  oracle_spacing_m: 10.0
  robust_loss: huber
  robust_scale: 1.5
  max_function_evaluations: 300
  random_seed: 42

map:
  resolution_m: 0.10
  bounds: [-1.0, 151.0, -16.0, 16.0]
  free_log_odds: -0.4
  occupied_log_odds: 0.85
  min_log_odds: -4.0
  max_log_odds: 4.0
  occupied_probability: 0.65
  max_range_epsilon_m: 0.05

evaluation:
  rpe_distance_m: 10.0
  differential_sample_spacing_m: 5.0
  overlap_bin_m: 20.0
  overlap_voxel_m: 0.5
  phase1_gate:
    max_sync_drop_ratio: 0.01
    differential_endpoint_improvement_min: 0.30
    chamfer_improvement_min: 0.20
    occupied_f1_allowed_drop: 0.02

      - [33.0, -7.50, 3.0]
      - [37.0, -3.75, 3.0]
      - [41.0, 0.00, 3.0]
      - [57.0, 0.00, 3.0]
      - [73.0, 0.00, 3.0]
      - [89.0, 0.00, 3.0]
      - [105.0, 0.00, 3.0]
      - [121.0, 0.00, 3.0]
      - [139.0, 0.00, 3.0]
    return_home_enabled: false
fusion:
  frame_id: swarm_map
  resolution: 0.10
  bounds: [-1.0, 151.0, -16.0, 16.0]
  publish_hz: 1.0
  map_timeout_sec: 2.0
  free_threshold: 25

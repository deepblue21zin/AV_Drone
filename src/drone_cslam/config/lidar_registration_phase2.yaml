vehicles:
  - name: drone1
    spawn: [3.0, -7.5, 0.0]
  - name: drone2
    spawn: [3.0, 7.5, 0.0]

topics:
  scan_suffix: scan
  odom_suffix: odom
  ground_truth_suffix: ground_truth/odom
  tf: /tf
  tf_static: /tf_static

sampling:
  keyframe_translation_m: 2.0
  keyframe_yaw_deg: 5.0
  interpolation_max_gap_sec: 0.25
  map_scan_stride: 2
  map_beam_stride: 3

pose_graph:
  intra_translation_sigma_m: 0.15
  intra_yaw_sigma_deg: 2.0
  prior_translation_sigma_m: 0.02
  prior_yaw_sigma_deg: 0.2
  registration_translation_sigma_m: 0.15
  registration_yaw_sigma_deg: 1.5
  factor_spacing_m: 10.0
  robust_loss: huber
  robust_scale: 1.5
  max_function_evaluations: 300

registration:
  # All submap construction below uses B0/raw SLAM only.
  submap_half_length_m: 5.0
  submap_scan_stride: 3
  submap_beam_stride: 2
  submap_voxel_m: 0.20
  minimum_submap_points: 80
  search_translation_m: 3.0
  search_yaw_deg: 25.0
  coarse_translation_step_m: 0.5
  coarse_yaw_step_deg: 2.5
  correspondence_distance_m: 0.60
  coarse_max_points: 700
  top_k: 8
  hypothesis_translation_separation_m: 0.75
  hypothesis_yaw_separation_deg: 5.0

gate:
  minimum_overlap_ratio: 0.18
  maximum_inlier_rmse_m: 0.40
  minimum_score_margin_ratio: 0.02
  maximum_correction_translation_m: 3.0
  maximum_correction_yaw_deg: 25.0

map:
  resolution_m: 0.10
  bounds: [-1.0, 151.0, -16.0, 16.0]
  free_log_odds: -0.4
  occupied_log_odds: 0.85
  min_log_odds: -4.0
  max_log_odds: 4.0
  occupied_probability: 0.65
  max_range_epsilon_m: 0.05

evaluation:
  rpe_distance_m: 10.0
  differential_sample_spacing_m: 5.0
  overlap_bin_m: 20.0
  overlap_voxel_m: 0.5

astar_global_planner:
  ros__parameters:
    pose_topic: /mavros/local_position/pose
    waypoint_topic: /drone1/planner/astar/waypoint
    compute_time_topic: /drone1/planner/astar/compute_time_ms
    goal_x: 140.0
    goal_y: 0.0
    goal_z: 3.0
    publish_hz: 5.0
    map_min_x: -2.0
    map_max_x: 150.0
    map_min_y: -14.0
    map_max_y: 14.0
    resolution: 0.5
    robot_radius: 1.4
    waypoint_reach_dist: 1.0
    lookahead_waypoint_count: 6
    world_path: /workspace/AV_Drone/sim_assets/worlds/obstacle_demo.world

mppi:
  ros__parameters:
    pose_topic: /mavros/local_position/pose
    cmd_topic: /drone1/autonomy/cmd_vel
    goal_reached_topic: /drone1/mission/goal_reached
    compute_time_topic: /drone1/planner/mppi/compute_time_ms
    astar_waypoint_topic: /drone1/planner/astar/waypoint
    cmd_rate_hz: 20.0
    pose_timeout_sec: 0.5
    goal_x: 140.0
    goal_y: 0.0
    goal_yaw: 0.0
    goal_tol_xy: 0.6
    use_astar_waypoint: true
    slowdown_dist: 2.0
    min_goal_scale: 0.25
    world_path: /workspace/AV_Drone/sim_assets/worlds/obstacle_demo.world
    cylinder_model_dir: /workspace/AV_Drone/sim_assets/models/cylinder_r05_h5
    cylinder_model_name: cylinder_r05_h5
    obstacle_default_radius: 0.5
    ignore_obstacles_within_start_radius: 0.0
    ignore_obstacles_center_x: 0.0
    ignore_obstacles_center_y: 0.0
    dt: 0.05
    horizon: 120
    num_samples: 250
    lam: 1.0
    v_max: 1.2
    yaw_rate_max: 1.2
    sigma_v: 0.8
    sigma_yaw_rate: 0.8
    v_nom: 1.0
    w_goal: 8.0
    w_goal_final: 30.0
    w_obst: 250.0
    w_ctrl: 0.2
    w_smooth: 0.4
    w_yaw: 0.5
    safety_margin: 1.2
    near_buffer: 1.0
    near_k: 30.0
    penetrate_k: 80.0
    penetrate_bias: 200.0
    nominal_update_alpha: 0.35
    repulsion_range: 0.0
    repulsion_gain: 0.0
    repulsion_max: 0.0
    random_seed: 0

safety_monitor:
  ros__parameters:
    pose_topic: /mavros/local_position/pose
    scan_topic: /drone1/scan
    planner_cmd_topic: /drone1/autonomy/cmd_vel
    safe_cmd_topic: /drone1/safety/cmd_vel
    safety_event_topic: /drone1/safety/event
    pose_timeout_sec: 1.0
    scan_timeout_sec: 1.0
    planner_cmd_timeout_sec: 1.0
    require_scan: true
    enable_obstacle_emergency_stop: false
    emergency_stop_distance: 0.9
    startup_grace_sec: 3.0

autonomy_manager:
  ros__parameters:
    mavros_namespace: /mavros
    pose_topic: /mavros/local_position/pose
    safe_cmd_topic: /drone1/safety/cmd_vel
    goal_reached_topic: /drone1/mission/goal_reached
    mission_phase_topic: /drone1/mission/phase
    home_pose_topic: /drone1/mission/home_pose
    active_goal_topic: /drone1/mission/active_goal
    takeoff_z: 3.0
    goal_x: 140.0
    goal_y: 0.0
    goal_z: 3.0
    hover_sec_after_takeoff: 2.0
    kp_z: 1.2
    vz_max: 1.0
    cmd_rate_hz: 20.0
    pose_timeout_sec: 0.5
    prestream_setpoints: 40
    takeoff_skip_margin: 0.25
    continuous_mode: false
    return_home_enabled: false

lidar_obstacle:
  ros__parameters:
    scan_topic: /drone1/scan
    output_topic: /drone1/perception/nearest_obstacle_distance
    valid_range_min: 0.05
    valid_range_max: 30.0

metrics_logger:
  ros__parameters:
    drone_name: drone1
    scenario_name: obstacle_demo_slit_world
    scenario_id: obstacle_demo_slit_world
    world_name: obstacle_demo
    world_path: /workspace/AV_Drone/sim_assets/worlds/obstacle_demo.world
    baseline_name: astar_vs_mppi_quantification
    planner_name: astar_guided_mppi
    planner_family: hybrid_global_local
    map_source: known_world
    planner_version: astar_mppi_v1
    controller_version: autonomy_manager_v1
    experiment_condition: astar_mppi_method
    condition_id: astar_mppi_method
    experiment_seed: 0
    experiment_stage: pilot
    trial_index: 0
    planner_compute_time_topic: /drone1/planner/mppi/compute_time_ms
    global_planner_compute_time_topic: /drone1/planner/astar/compute_time_ms
    state_topic: /mavros/state
    pose_topic: /mavros/local_position/pose
    scan_topic: /drone1/scan
    planner_cmd_topic: /drone1/autonomy/cmd_vel
    safe_cmd_topic: /drone1/safety/cmd_vel
    safety_event_topic: /drone1/safety/event
    goal_reached_topic: /drone1/mission/goal_reached
    mission_phase_topic: /drone1/mission/phase
    nearest_obstacle_topic: /drone1/perception/nearest_obstacle_distance
    artifacts_root: /workspace/AV_Drone/artifacts
    run_name: astar_mppi_slit_world
    autonomy_config_path: /workspace/AV_Drone/src/drone_bringup/config/drone1_astar_mppi_known_world.yaml
    launch_file_path: /workspace/AV_Drone/src/drone_bringup/launch/single_drone_astar_mppi_known_world.launch.py

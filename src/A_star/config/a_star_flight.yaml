a_star:
  ros__parameters:
    pose_topic: /mavros/local_position/pose
    cmd_topic: /drone1/autonomy/cmd_vel
    goal_reached_topic: /drone1/mission/goal_reached
    compute_time_topic: /drone1/planner/astar/compute_time_ms
    world_path: /workspace/AV_Drone/sim_assets/worlds/random_cylinders_double.world
    goal_x: 140.0
    goal_y: 0.0
    map_min_x: -2.0
    map_max_x: 150.0
    map_min_y: -14.0
    map_max_y: 14.0
    resolution: 0.5
    # 원기둥 모서리를 pure-pursuit가 잘라 들어가는 추종 오차까지 포함한다.
    robot_radius: 1.8
    lookahead_distance: 3.0
    # Match MPPI's effective command cap for the 1.5x speed experiment.
    cruise_speed: 2.7
    max_speed: 2.7
    turn_preview_distance: 4.0
    turn_speed: 2.4
    turn_angle_threshold: 0.5
    max_planar_accel: 1.5
    goal_tolerance: 0.7

safety_monitor:
  ros__parameters:
    pose_topic: /mavros/local_position/pose
    scan_topic: /drone1/scan
    planner_cmd_topic: /drone1/autonomy/cmd_vel
    safe_cmd_topic: /drone1/safety/cmd_vel
    safety_event_topic: /drone1/safety/event
    pose_timeout_sec: 1.0
    scan_timeout_sec: 1.0
    planner_cmd_timeout_sec: 1.0
    require_scan: true
    enable_obstacle_emergency_stop: false
    startup_grace_sec: 3.0

autonomy_manager:
  ros__parameters:
    mavros_namespace: /mavros
    pose_topic: /mavros/local_position/pose
    safe_cmd_topic: /drone1/safety/cmd_vel
    goal_reached_topic: /drone1/mission/goal_reached
    mission_phase_topic: /drone1/mission/phase
    home_pose_topic: /drone1/mission/home_pose
    active_goal_topic: /drone1/mission/active_goal
    takeoff_z: 3.0
    goal_x: 140.0
    goal_y: 0.0
    goal_z: 3.0
    hover_sec_after_takeoff: 2.0
    kp_z: 1.2
    vz_max: 1.0
    cmd_rate_hz: 20.0
    pose_timeout_sec: 0.5
    prestream_setpoints: 40
    continuous_mode: false
    return_home_enabled: false

lidar_obstacle:
  ros__parameters:
    scan_topic: /drone1/scan
    output_topic: /drone1/perception/nearest_obstacle_distance
    valid_range_min: 0.05
    valid_range_max: 30.0

metrics_logger:
  ros__parameters:
    drone_name: drone1
    scenario_name: a_star_random_cylinders_double
    baseline_name: pure_a_star
    planner_name: a_star_grid_pure_pursuit
    planner_family: graph_search
    map_source: known_world
    scenario_id: random_cylinders_double
    experiment_condition: astar_method
    condition_id: astar_method
    experiment_seed: 0
    experiment_stage: pilot
    trial_index: 0
    planner_compute_time_topic: /drone1/planner/astar/compute_time_ms
    global_planner_compute_time_topic: ""
    world_name: random_cylinders_double
    world_path: /workspace/AV_Drone/sim_assets/worlds/random_cylinders_double.world
    planner_version: a_star_v1
    controller_version: autonomy_manager_v1
    state_topic: /mavros/state
    pose_topic: /mavros/local_position/pose
    scan_topic: /drone1/scan
    planner_cmd_topic: /drone1/autonomy/cmd_vel
    safe_cmd_topic: /drone1/safety/cmd_vel
    safety_event_topic: /drone1/safety/event
    goal_reached_topic: /drone1/mission/goal_reached
    mission_phase_topic: /drone1/mission/phase
    nearest_obstacle_topic: /drone1/perception/nearest_obstacle_distance
    artifacts_root: /workspace/AV_Drone/artifacts
    run_name: a_star_flight
    autonomy_config_path: /workspace/AV_Drone/src/A_star/config/a_star_flight.yaml
    launch_file_path: /workspace/AV_Drone/src/A_star/launch/a_star_flight.launch.py
